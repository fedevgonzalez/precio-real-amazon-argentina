<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Precio real Amazon Argentina</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="ticket">
    <header class="cabecera">
      <h1>Precio real · Argentina</h1>
    </header>

    <div id="detalle" aria-live="polite"></div>

    <section class="ajustes" aria-labelledby="h-ajustes">
      <div class="ajustes-cab">
        <h2 id="h-ajustes">Ajustes</h2>
        <span id="estado" role="status"></span>
      </div>

      <div class="campo">
        <label for="enviosUsados">Envíos usados este año</label>
        <input id="enviosUsados" type="number" inputmode="numeric" min="0" max="99" aria-describedby="d-envios">
        <small id="d-envios">Con 5 se pierde la franquicia de USD 400.</small>
      </div>

      <div class="campo">
        <label for="unidades">Unidades iguales en el pedido</label>
        <input id="unidades" type="number" inputmode="numeric" min="1" max="99" aria-describedby="d-unidades">
        <small id="d-unidades">Más de 3 sale del régimen simplificado.</small>
      </div>

      <div class="campo">
        <label for="ivaReducido">IVA reducido 10,5 %</label>
        <input id="ivaReducido" type="checkbox" role="switch" aria-describedby="d-iva">
        <small id="d-iva">Notebooks, tablets y similares. Apagado: 21 %.</small>
      </div>
    </section>

    <p class="pie">Estimación orientativa. Lo que cobra Amazon en el checkout manda. Extensión independiente, no afiliada a Amazon.</p>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
